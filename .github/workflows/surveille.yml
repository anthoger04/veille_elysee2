name: Surveille billetterie Elysee

on:
  schedule:
    # Filet large : toutes les 5 min, décalé pour éviter la queue GitHub, toute l'année
    - cron: "3-59/5 * * * *"
    # Filet serré : chaque minute de 17h55 à 17h59 (heure de Paris = 15h55-15h59 UTC)
    # uniquement du 1er au 15 septembre
    - cron: "55-59 15 1-15 9 *"
    # Filet serré : chaque minute de 18h00 à 18h10 (heure de Paris = 16h00-16h10 UTC)
    # uniquement du 1er au 15 septembre
    - cron: "0-10 16 1-15 9 *"
  workflow_dispatch: {}  # bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Verifie la page actualites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 surveille_elysee.py

      # Sauvegarde l'etat (seen_links.json) pour le prochain run
      - name: Commit etat mis a jour
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "update seen links"
          git push
        continue-on-error: true
